name: kacon-erp

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      sh -c "redis-server
      --appendonly yes
      --requirepass \"$${REDIS_PASSWORD:?REDIS_PASSWORD is required}\""
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - erp-redis-data:/data
    networks:
      - erp-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Bind to loopback only. Expose LAN/public access via 1Panel reverse
      # proxy / tunnel — do not publish the API on 0.0.0.0.
      - "127.0.0.1:18080:8080"
    environment:
      - NODE_ENV=production
      - COOKIE_SECURE=${COOKIE_SECURE:-auto}
      - COOKIE_SAME_SITE=${COOKIE_SAME_SITE:-lax}
      - TRUST_PROXY_CIDRS=${TRUST_PROXY_CIDRS:-172.16.0.0/12,127.0.0.1}
      - PORT=8080
      - PUBLIC_API_BASE_URL=${PUBLIC_API_BASE_URL}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-erp_app}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-mes}
      - DB_CONNECTION_LIMIT=10
      - DB_QUEUE_LIMIT=20
      - DB_CONNECT_TIMEOUT=60000
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ISSUER=${JWT_ISSUER:-erp-system}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-erp-users}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_ACCESS_TOKEN_EXPIRY=2h
      - JWT_REFRESH_TOKEN_EXPIRY=7d
      - JWT_ACCESS_EXPIRY=2h
      - JWT_REFRESH_EXPIRY=7d
      - CSRF_SECRET=${CSRF_SECRET}
      - DEFAULT_ADMIN_PASSWORD_HASH=${DEFAULT_ADMIN_PASSWORD_HASH}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - REDIS_ENABLED=true
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=0
      - LOGIN_MAX_FAILED_ATTEMPTS=${LOGIN_MAX_FAILED_ATTEMPTS:-5}
      - LOGIN_LOCK_DURATION_MINUTES=${LOGIN_LOCK_DURATION_MINUTES:-15}
      - OLLAMA_HOST=${OLLAMA_HOST}
      - OLLAMA_OCR_MODEL=deepseek-ocr:latest
      - OLLAMA_TIMEOUT=60000
      - ZHIPU_API_KEY=${ZHIPU_API_KEY}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY}
      - SILICONFLOW_VLM_MODEL=deepseek-ai/DeepSeek-OCR
      - LOG_LEVEL=info
      - ENABLE_DEBUG_LOG=false
      - ENABLE_SQL_LOG=false
      - BACKUP_DIR=/app/backups
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
      - BACKUP_RETENTION_COUNT=${BACKUP_RETENTION_COUNT:-30}
      - BACKUP_ENCRYPTION_MODE=${BACKUP_ENCRYPTION_MODE:-required}
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY}
    volumes:
      - erp-uploads:/app/uploads
      - erp-logs:/app/logs
      - erp-backups:/app/backups
    networks:
      - erp-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # LAN ERP UI (internal). Prefer fronting with 1Panel/nginx TLS in production.
      - "18081:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mobile:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Internal mobile UI; prefer reverse-proxy TLS in production.
      - "18082:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  erp-network:
    driver: bridge

volumes:
  erp-uploads:
    driver: local
  erp-logs:
    driver: local
  erp-backups:
    driver: local
  erp-redis-data:
    driver: local
