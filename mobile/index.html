<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="theme-color" content="#00A896">
    <meta name="application-name" content="KACON-ERP">
    <meta name="description" content="企业资源管理系统移动端">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-touch-fullscreen" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="KACON-ERP">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.svg">
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.svg">
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512x512.svg">

    <title>KACON-ERP移动端</title>

    <style>
      :root {
        --app-viewport-height: 100dvh;
        --app-shell-height: var(--app-viewport-height);
        --app-width: 100%;
        --safe-area-top: env(safe-area-inset-top, 0px);
        --safe-area-right: env(safe-area-inset-right, 0px);
        --safe-area-bottom: env(safe-area-inset-bottom, 0px);
        --safe-area-left: env(safe-area-inset-left, 0px);
        background: #f5f7fa;
      }

      html {
        height: 100%;
        min-height: -webkit-fill-available;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        min-height: 100%;
        min-height: var(--app-shell-height);
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        background: #f5f7fa;
      }

      body {
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }

      #app {
        width: 100%;
        height: 100%;
        height: var(--app-shell-height);
        min-height: 100%;
        background: #f5f7fa;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
