worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Route every request, including assets/API/WebSocket, to the same UI.
    # Android tablets and iPads with an identifiable UA use the mobile UI too.
    map $http_user_agent $erp_origin {
        default http://192.168.1.251:18081;
        ~*(android|iphone|ipad|ipod|windows\ phone|iemobile|opera\ mini|mobile) http://192.168.1.251:18082;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    map $http_x_forwarded_proto $client_proto {
        default $scheme;
        http http;
        https https;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 10m;

        location = /gateway-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass $erp_origin;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $client_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # A URL can serve different applications. Prevent shared caches
            # from returning one device's application to another device.
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            add_header Cache-Control "no-store" always;
            add_header Vary "User-Agent" always;
        }
    }
}
