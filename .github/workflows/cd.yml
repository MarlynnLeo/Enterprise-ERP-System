name: ERP CD

on:
  workflow_run:
    workflows: [ERP CI]
    types: [completed]
    branches: [main]

env:
  DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY || '' }}
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Require Successful CI
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm release source
        run: echo "Releasing ${{ github.event.workflow_run.head_sha || github.sha }} after CI success"

  backend-test:
    name: Backend Test
    needs: release-gate
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: erp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      DISABLE_CRON: 'true'
      ENABLE_RATE_LIMIT: 'false'
      REDIS_ENABLED: 'false'
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: erp_test
      JWT_SECRET: ci-test-jwt-secret-change-in-production
      JWT_REFRESH_SECRET: ci-test-refresh-secret-change-in-production
      CSRF_SECRET: ci-test-csrf-secret-change-in-production
      DEFAULT_ADMIN_PASSWORD: '123456'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Prepare test database
        working-directory: backend
        run: |
          npm run migrate
          npm run seed
          npm run bootstrap:verify

      - name: Run backend tests
        working-directory: backend
        run: npm test -- --detectOpenHandles

      - name: Run full write-path UAT
        working-directory: backend
        env:
          RUN_LIVE_UAT: '1'
        run: npm test -- tests/integration/uat-full-business-flow.test.js --detectOpenHandles

  frontend-build:
    name: Frontend Build
    needs: release-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  mobile-build:
    name: Mobile Build
    needs: release-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Build mobile
        working-directory: mobile
        run: npm run build

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: [release-gate, backend-test, frontend-build, mobile-build]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: |
            erp-backend:${{ env.IMAGE_TAG }}
            erp-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: |
            erp-frontend:${{ env.IMAGE_TAG }}
            erp-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build mobile image
        uses: docker/build-push-action@v6
        with:
          context: ./mobile
          file: ./mobile/Dockerfile
          load: true
          tags: |
            erp-mobile:${{ env.IMAGE_TAG }}
            erp-mobile:latest
          cache-from: type=gha,scope=mobile
          cache-to: type=gha,mode=max,scope=mobile

      - name: Verify images
        run: |
          docker images erp-backend
          docker images erp-frontend
          docker images erp-mobile

      - name: Login to Docker registry
        if: >
          env.DOCKER_REGISTRY != '' &&
          github.event_name == 'workflow_run'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push backend image
        if: >
          env.DOCKER_REGISTRY != '' &&
          github.event_name == 'workflow_run'
        run: |
          docker tag erp-backend:${{ env.IMAGE_TAG }} ${{ env.DOCKER_REGISTRY }}/erp-backend:${{ env.IMAGE_TAG }}
          docker tag erp-backend:latest ${{ env.DOCKER_REGISTRY }}/erp-backend:latest
          docker push ${{ env.DOCKER_REGISTRY }}/erp-backend:${{ env.IMAGE_TAG }}
          docker push ${{ env.DOCKER_REGISTRY }}/erp-backend:latest

      - name: Push frontend image
        if: >
          env.DOCKER_REGISTRY != '' &&
          github.event_name == 'workflow_run'
        run: |
          docker tag erp-frontend:${{ env.IMAGE_TAG }} ${{ env.DOCKER_REGISTRY }}/erp-frontend:${{ env.IMAGE_TAG }}
          docker tag erp-frontend:latest ${{ env.DOCKER_REGISTRY }}/erp-frontend:latest
          docker push ${{ env.DOCKER_REGISTRY }}/erp-frontend:${{ env.IMAGE_TAG }}
          docker push ${{ env.DOCKER_REGISTRY }}/erp-frontend:latest

      - name: Push mobile image
        if: >
          env.DOCKER_REGISTRY != '' &&
          github.event_name == 'workflow_run'
        run: |
          docker tag erp-mobile:${{ env.IMAGE_TAG }} ${{ env.DOCKER_REGISTRY }}/erp-mobile:${{ env.IMAGE_TAG }}
          docker tag erp-mobile:latest ${{ env.DOCKER_REGISTRY }}/erp-mobile:latest
          docker push ${{ env.DOCKER_REGISTRY }}/erp-mobile:${{ env.IMAGE_TAG }}
          docker push ${{ env.DOCKER_REGISTRY }}/erp-mobile:latest

      - name: Write deployment summary
        run: |
          echo "## ERP CD build summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Git SHA | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend image | \`erp-backend:${{ env.IMAGE_TAG }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend image | \`erp-frontend:${{ env.IMAGE_TAG }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Mobile image | \`erp-mobile:${{ env.IMAGE_TAG }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build time | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
