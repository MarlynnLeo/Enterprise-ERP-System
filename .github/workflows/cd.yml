# =============================================================================
# ERP 持续部署（CD）流水线
# =============================================================================
# 触发条件：main 分支 push 或手动触发
# 构建流程：后端测试 → 前端构建 → 移动端构建 → Docker 镜像构建 → 可选推送
# =============================================================================

name: ERP CD

on:
  # 主分支推送时自动触发
  push:
    branches: [main]
  # 支持手动触发，可选择是否推送镜像到注册表
  workflow_dispatch:
    inputs:
      push_images:
        description: '是否推送 Docker 镜像到注册表'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

# 环境变量：Docker 注册表配置（在 GitHub Settings → Secrets 中设置）
env:
  # Docker 注册表地址（如：registry.cn-hangzhou.aliyuncs.com/your-namespace）
  DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY || '' }}
  # 镜像标签：使用 Git SHA 短哈希
  IMAGE_TAG: ${{ github.sha }}

# 同一分支只允许一个部署流程运行，新的推送会取消旧的
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # 步骤 1：后端测试
  # ===========================================================================
  backend-test:
    name: 后端测试
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout 代码
        uses: actions/checkout@v4

      # 2. 设置 Node.js 20 运行环境
      - name: 设置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # 3. 安装后端依赖（使用 npm ci 确保依赖精确一致）
      - name: 安装后端依赖
        working-directory: backend
        run: npm ci

      # 4. 执行后端测试（forceExit 避免 Jest 挂起）
      - name: 运行后端测试
        working-directory: backend
        run: npm test -- --forceExit --detectOpenHandles

  # ===========================================================================
  # 步骤 2：前端构建
  # ===========================================================================
  frontend-build:
    name: 前端构建
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout 代码
        uses: actions/checkout@v4

      # 2. 设置 Node.js 20 运行环境
      - name: 设置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 3. 安装前端依赖
      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      # 4. 构建前端生产版本
      - name: 构建前端
        working-directory: frontend
        run: npm run build

      # 5. 上传构建产物供后续 Docker 构建使用
      - name: 上传前端构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # ===========================================================================
  # 步骤 3：移动端构建
  # ===========================================================================
  mobile-build:
    name: 移动端构建
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout 代码
        uses: actions/checkout@v4

      # 2. 设置 Node.js 20 运行环境
      - name: 设置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # 3. 安装移动端依赖
      - name: 安装移动端依赖
        working-directory: mobile
        run: npm ci

      # 4. 构建移动端生产版本
      - name: 构建移动端
        working-directory: mobile
        run: npm run build

  # ===========================================================================
  # 步骤 4：Docker 镜像构建与推送
  # ===========================================================================
  docker-build:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    # 依赖前置步骤全部成功
    needs: [backend-test, frontend-build, mobile-build]

    steps:
      # 1. 拉取代码
      - name: Checkout 代码
        uses: actions/checkout@v4

      # 2. 设置 Docker Buildx（支持缓存和多平台构建）
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. 构建后端 Docker 镜像
      #    使用 GitHub Actions 缓存加速构建（缓存 Docker 层）
      - name: 构建后端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: |
            erp-backend:${{ env.IMAGE_TAG }}
            erp-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # 4. 下载前端构建产物（来自 frontend-build 步骤）
      - name: 下载前端构建产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      # 5. 构建前端 Docker 镜像
      - name: 构建前端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: |
            erp-frontend:${{ env.IMAGE_TAG }}
            erp-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # 6. 验证构建的镜像是否正常
      - name: 验证镜像
        run: |
          echo "=== 后端镜像信息 ==="
          docker images erp-backend
          echo ""
          echo "=== 前端镜像信息 ==="
          docker images erp-frontend

      # 7. 可选：推送镜像到 Docker 注册表
      #    需要在 GitHub Secrets 中配置：
      #    - DOCKER_REGISTRY: 注册表地址
      #    - DOCKER_USERNAME: 注册表用户名
      #    - DOCKER_PASSWORD: 注册表密码
      - name: 登录 Docker 注册表
        if: >
          env.DOCKER_REGISTRY != '' &&
          (github.event.inputs.push_images == 'true' || github.event_name == 'push')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 推送后端镜像到注册表
        if: >
          env.DOCKER_REGISTRY != '' &&
          (github.event.inputs.push_images == 'true' || github.event_name == 'push')
        run: |
          # 给镜像打上注册表前缀标签
          docker tag erp-backend:${{ env.IMAGE_TAG }} ${{ env.DOCKER_REGISTRY }}/erp-backend:${{ env.IMAGE_TAG }}
          docker tag erp-backend:latest ${{ env.DOCKER_REGISTRY }}/erp-backend:latest
          # 推送到注册表
          docker push ${{ env.DOCKER_REGISTRY }}/erp-backend:${{ env.IMAGE_TAG }}
          docker push ${{ env.DOCKER_REGISTRY }}/erp-backend:latest
          echo "✅ 后端镜像已推送: ${{ env.DOCKER_REGISTRY }}/erp-backend:${{ env.IMAGE_TAG }}"

      - name: 推送前端镜像到注册表
        if: >
          env.DOCKER_REGISTRY != '' &&
          (github.event.inputs.push_images == 'true' || github.event_name == 'push')
        run: |
          # 给镜像打上注册表前缀标签
          docker tag erp-frontend:${{ env.IMAGE_TAG }} ${{ env.DOCKER_REGISTRY }}/erp-frontend:${{ env.IMAGE_TAG }}
          docker tag erp-frontend:latest ${{ env.DOCKER_REGISTRY }}/erp-frontend:latest
          # 推送到注册表
          docker push ${{ env.DOCKER_REGISTRY }}/erp-frontend:${{ env.IMAGE_TAG }}
          docker push ${{ env.DOCKER_REGISTRY }}/erp-frontend:latest
          echo "✅ 前端镜像已推送: ${{ env.DOCKER_REGISTRY }}/erp-frontend:${{ env.IMAGE_TAG }}"

      # 8. 构建摘要输出
      - name: 输出部署摘要
        run: |
          echo "## 🚀 CD 构建摘要" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Git SHA | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 后端镜像 | \`erp-backend:${{ env.IMAGE_TAG }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 前端镜像 | \`erp-frontend:${{ env.IMAGE_TAG }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 触发方式 | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 构建时间 | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
